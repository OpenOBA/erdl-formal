[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erdl-formal"
version = "0.1.15"
description = "SMT-based (Z3) formal verification for the ERDL expression kernel — proving rules safe over all inputs."
readme = "README.en.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenOBA", email = "support@openoba.com" }]
keywords = ["erdl", "formal-verification", "smt", "z3", "cvc5", "policy", "ai-agent", "deterministic"]
dependencies = ["z3-solver>=4.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
