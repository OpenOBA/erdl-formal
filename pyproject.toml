[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erdl-formal"
version = "0.2.0"
description = "SMT-based (Z3) formal verification for the ERDL expression kernel — proving rules safe over all inputs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenOBA", email = "support@openoba.com" }]
keywords = ["erdl", "formal-verification", "smt", "z3", "cvc5", "policy", "ai-agent", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["z3-solver>=4.13"]

[project.urls]
Homepage = "https://github.com/OpenOBA/erdl-formal"
Repository = "https://github.com/OpenOBA/erdl-formal"
Documentation = "https://github.com/OpenOBA/erdl-formal#readme"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
